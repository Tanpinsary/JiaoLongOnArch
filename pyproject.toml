[project]
name = "jiaolongonarch"
version = "0.1.0"
description = "Safe userspace controls for MECHREVO Jiaolong MRID6 on Linux"
requires-python = ">=3.10"
dependencies = [
    "textual>=6,<9",
]

[dependency-groups]
dev = [
    "ruff==0.12.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
